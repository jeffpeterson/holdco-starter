name = "holdco-tasks"
main = "./src/worker.ts"
compatibility_date = "2026-06-26"

# Explicit since wrangler 4.105 flipped the default for an absent key to false.
workers_dev = true

# Run the Worker for every request — Worker serves /api/* and /login,
# then falls through to static assets for everything else.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "holdco-tasks"
database_id = "<YOUR_D1_DATABASE_ID>"

# Secrets (set via wrangler secret put, NOT in this file or git):
#   OWNER_TOKEN  — browser cookie for the owner UI
#   AGENT_TOKEN  — Bearer token for agents / bin/holdco CLI
